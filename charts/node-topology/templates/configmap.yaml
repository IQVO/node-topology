# Non-secret configuration of the api component, mirrored from the env the
# Deployment renders and mounted into the api container with envFrom (the
# explicit env entries win for the same key); the Deployment's
# checksum/config annotation rolls the pods whenever any of it changes. Every
# key is a variable cmd/api reads (tests/render_test.sh). DATABASE_URL never
# lands here: it lives in the Secret (templates/secret.yaml or
# database.existingSecret). This service consumes no topic: no consumer group.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "node-topology.fullname" . }}
  labels:
    {{- include "node-topology.labels" . | nindent 4 }}
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  KAFKA_BROKERS: {{ required "node-topology requires kafka.brokers to be set (KAFKA_BROKERS, comma-separated): the service runs on real Kafka only and exits at boot without it." .Values.kafka.brokers | quote }}
  {{- with .Values.config.outboxRelayInterval }}
  OUTBOX_RELAY_INTERVAL: {{ . | quote }}
  {{- end }}
  OUTBOX_MAX_ATTEMPTS: {{ .Values.config.outboxMaxAttempts | quote }}
  {{- with .Values.config.shutdownDrainDelay }}
  SHUTDOWN_DRAIN_DELAY: {{ . | quote }}
  {{- end }}
