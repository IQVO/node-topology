apiVersion: v1
kind: Service
metadata:
  name: {{ include "node-topology.fullname" . }}
  labels:
    {{- include "node-topology.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # component=api pins this Service to the api Deployment's pods
  # (tests/test_service_selectors.py).
  selector:
    {{- include "node-topology.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
