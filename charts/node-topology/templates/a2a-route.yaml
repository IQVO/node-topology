{{- if and .Values.a2a.enabled .Values.a2a.route.enabled -}}
{{- /*
A2A exposure through the gateway (fleet decision: gateway config lives in the
application charts, not in the infrastructure repo).

Host contract: /api/a2a/<context> -> Service <context>-a2a:8093, prefix
rewritten to / (the JSON-RPC root mount; /.well-known/agent-card.json stays
reachable under the same prefix, so card discovery works through the gateway
too). /healthz deliberately stays off the host -- it is a Kubernetes probe
concern, not a public endpoint. No auth anywhere on the route (fleet-wide
revert 2026-09-11): access control is the in-cluster boundary.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "node-topology.a2aFullname" . }}
  labels:
    {{- include "node-topology.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  parentRefs:
    {{- range .Values.a2a.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.a2a.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "node-topology.a2aFullname" . }}
          port: {{ .Values.a2a.service.port }}
{{- end }}
