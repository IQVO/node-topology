# Used by `helm lint` / `ct lint`: every optional value and component set at
# once (api + mcp + a2a + frontend, plus the optional gateway route, HPA and the
# mcp and a2a host routes). Dummy values, no password.
database:
  existingSecret: "node-topology-db"
kafka:
  brokers: "kafka-0.kafka.warehouse-systems.svc.cluster.local:9092,kafka-1.kafka.warehouse-systems.svc.cluster.local:9092"
config:
  logLevel: "debug"
  outboxRelayInterval: "500ms"
  outboxMaxAttempts: 20
  shutdownDrainDelay: "5s"
gatewayApi:
  enabled: true
  parentRefs:
    - name: warehouse-gateway
      namespace: kong
      sectionName: http
  hosts:
    - path: /api/node-topology
      pathType: PathPrefix
autoscaling:
  api:
    enabled: true
mcp:
  enabled: true
  route:
    enabled: true
    parentRefs:
      - name: warehouse-gateway
        namespace: kong
        sectionName: http
a2a:
  enabled: true
  route:
    enabled: true
    parentRefs:
      - name: warehouse-gateway
        namespace: kong
        sectionName: http
frontend:
  enabled: true
