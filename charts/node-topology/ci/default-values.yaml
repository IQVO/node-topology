# Used by `helm lint` / `ct lint` (chart-testing): the chart refuses to render
# without a database source and without Kafka brokers (Postgres and Kafka are
# the only runtime). Dummy values, no password. This service consumes no topic,
# so there is no consumer group to set.
database:
  url: "postgres://u@example.invalid:5432/db"
kafka:
  brokers: "kafka.example.invalid:9092"
