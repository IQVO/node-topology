openapi: 3.0.3
info:
  title: Node Topology API
  version: 0.1.0
  contact:
    name: node-topology maintainers
    url: https://github.com/IQVO/node-topology
  description: >-
    REST contract of the node-topology bounded context of the retail
    network, derived from retail-network-docs model/model.yaml
    (contexts[node-topology].rest, .aggregates, .publishes,
    conventions.errors). Node Topology is the
    authoritative registry of nodes, their declared operational profiles,
    lanes, regions and service areas. vendor-connectivity calls POST /nodes and
    PUT /nodes/{nodeId}/operational-profile in-organization while it processes
    vendor submissions; the network-ops planner calls the other write routes
    and may also declare a network node's profile (declaredBy NETWORK_OPS);
    any context may call the read routes. No authentication, consistent with
    the fleet. Errors are RFC 9457 problem details. The shared problem types
    are not-found (404), illegal-transition (409), concurrent-update (409) and
    validation-failed (422).
servers:
  - url: http://localhost:8080
tags:
  - name: Nodes
    description: Nodes, their lifecycle and their declared operational profile (aggregate Node).
  - name: Lanes
    description: Directed, mode-specific connections between nodes (aggregate Lane).
  - name: Service Areas
    description: Which delivery station serves a postal prefix (aggregate ServiceArea).
  - name: Regions
    description: Partitions of the network (aggregate Region).
paths:
  /nodes:
    post:
      tags: [Nodes]
      operationId: registerNode
      summary: Register a node (RegisterNode)
      description: >-
        Creates a node in state PROPOSED and publishes NodeRegistered.
        Capabilities are derived from the node type (DefaultCapabilitiesByType).
        Parcel nodes (SORTATION_CENTER, DELIVERY_STATION, AIR_HUB) must have
        operator NETWORK.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterNodeRequest'
      responses:
        '201':
          description: Node registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '409':
          description: "vendor-node-code-taken (ErrVendorNodeCodeTaken), or concurrent-update (ErrConcurrentUpdate)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: "operator-not-allowed-for-node-type (ErrOperatorNotAllowedForNodeType), unknown-region (ErrUnknownRegion), subtype-not-allowed (ErrSubtypeNotAllowed), or validation-failed."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [Nodes]
      operationId: listNodes
      summary: List nodes by type, region and status (ListNodes)
      description: Open Host Service read. Each filter is optional and filters combine with AND; an empty result is 200 with an empty list.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NodeType'
        - name: region
          in: query
          required: false
          description: A regionId.
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NodeStatus'
      responses:
        '200':
          description: Matching nodes.
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
  /nodes/{nodeId}:
    get:
      tags: [Nodes]
      operationId: getNode
      summary: Get one node with its current operational profile (GetNode)
      description: Open Host Service read of one node with its capabilities and current operational profile revision. An unknown nodeId is 404 not-found.
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: The node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          $ref: '#/components/responses/NodeNotFound'
  /nodes/{nodeId}/operational-profile:
    put:
      tags: [Nodes]
      operationId: declareOperationalProfile
      summary: Declare a new operational profile revision (DeclareOperationalProfile)
      description: >-
        Appends a profile revision; earlier revisions are never edited.
        Called by vendor-connectivity (declaredBy VENDOR) and by the
        network-ops planner (declaredBy NETWORK_OPS). Every day of a cutoff
        must fall inside the operating hours of that day, and a revision of an
        ACTIVE FULFILLMENT_CENTER keeps at least one cutoff and a handlingTime
        above zero. sortDwellMinutes is accepted only for SORTATION_CENTER and
        AIR_HUB nodes. Publishes NodeOperationalProfileDeclared.
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationalProfileDeclaration'
      responses:
        '200':
          description: Profile revision stored; the node with its current profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          $ref: '#/components/responses/NodeNotFound'
        '409':
          description: "stale-profile-revision (ErrStaleProfileRevision), incomplete-operational-profile (ErrIncompleteOperationalProfile), node-retired (ErrNodeRetired), or concurrent-update (ErrConcurrentUpdate)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: "cutoff-outside-operating-hours (ErrCutoffOutsideOperatingHours), sort-dwell-not-allowed (ErrSortDwellNotAllowed), or validation-failed."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /nodes/{nodeId}:activate:
    post:
      tags: [Nodes]
      operationId: activateNode
      summary: Activate a node (ActivateNode)
      description: PROPOSED or SUSPENDED to ACTIVE. Publishes NodeActivated.
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Node is ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          $ref: '#/components/responses/NodeNotFound'
        '409':
          description: "incomplete-operational-profile (ErrIncompleteOperationalProfile), node-retired (ErrNodeRetired), illegal-transition (ErrIllegalTransition), or concurrent-update (ErrConcurrentUpdate)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /nodes/{nodeId}:suspend:
    post:
      tags: [Nodes]
      operationId: suspendNode
      summary: Suspend a node (SuspendNode)
      description: ACTIVE to SUSPENDED. Publishes NodeSuspended.
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendNodeRequest'
      responses:
        '200':
          description: Node is SUSPENDED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          $ref: '#/components/responses/NodeNotFound'
        '409':
          description: "node-retired (ErrNodeRetired), illegal-transition (ErrIllegalTransition), or concurrent-update (ErrConcurrentUpdate)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /nodes/{nodeId}:retire:
    post:
      tags: [Nodes]
      operationId: retireNode
      summary: Retire a node (RetireNode)
      description: ACTIVE or SUSPENDED to RETIRED, which is terminal. Publishes NodeRetired.
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Node is RETIRED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          $ref: '#/components/responses/NodeNotFound'
        '409':
          description: "node-retired (ErrNodeRetired), illegal-transition (ErrIllegalTransition), or concurrent-update (ErrConcurrentUpdate)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /lanes:
    post:
      tags: [Lanes]
      operationId: openLane
      summary: Open a lane between two nodes (OpenLane)
      description: Both ends must be ACTIVE and the type pair allowed. Publishes LaneOpened.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenLaneRequest'
      responses:
        '201':
          description: Lane OPEN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lane'
        '404':
          $ref: '#/components/responses/NodeNotFound'
        '409':
          description: "lane-endpoint-not-active (ErrLaneEndpointNotActive), duplicate-lane (ErrDuplicateLane), or concurrent-update (ErrConcurrentUpdate)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: "lane-loop (ErrLaneLoop), lane-type-pair-not-allowed (ErrLaneTypePairNotAllowed), or validation-failed."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [Lanes]
      operationId: listLanes
      summary: List lanes by origin and destination (ListLanes)
      description: Open Host Service read. Both filters are optional and combine with AND; open and closed lanes are listed, distinguished by status.
      parameters:
        - name: origin
          in: query
          required: false
          description: Origin nodeId.
          schema:
            type: string
        - name: destination
          in: query
          required: false
          description: Destination nodeId.
          schema:
            type: string
      responses:
        '200':
          description: Matching lanes.
          content:
            application/json:
              schema:
                type: object
                required: [lanes]
                properties:
                  lanes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lane'
  /lanes/{laneId}:close:
    post:
      tags: [Lanes]
      operationId: closeLane
      summary: Close a lane (CloseLane)
      description: OPEN to CLOSED. Publishes LaneClosed.
      parameters:
        - name: laneId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Lane CLOSED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lane'
        '404':
          description: not-found (ErrNotFound).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: "illegal-transition (ErrIllegalTransition): the lane is already CLOSED; or concurrent-update (ErrConcurrentUpdate)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /service-areas/{postalPrefix}:
    parameters:
      - $ref: '#/components/parameters/PostalPrefix'
    put:
      tags: [Service Areas]
      operationId: assignServiceArea
      summary: Assign a postal prefix to a delivery station (AssignServiceArea)
      description: >-
        Creates or reassigns the prefix under a strictly higher
        assignmentVersion (ASSIGNED to ASSIGNED). The region is taken from the
        station and must be a defined Region. Publishes ServiceAreaAssigned.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignServiceAreaRequest'
      responses:
        '200':
          description: Assignment stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceArea'
        '404':
          $ref: '#/components/responses/NodeNotFound'
        '409':
          description: "not-a-delivery-station (ErrNotADeliveryStation), stale-assignment-version (ErrStaleAssignmentVersion), or concurrent-update (ErrConcurrentUpdate)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: "unknown-region (ErrUnknownRegion), or validation-failed."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [Service Areas]
      operationId: resolveServiceArea
      summary: Resolve which delivery station serves a postal prefix (ResolveServiceArea)
      description: Open Host Service read of the current assignment of a postal prefix. An unassigned prefix is 404 not-found.
      responses:
        '200':
          description: The current assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceArea'
        '404':
          description: not-found (ErrNotFound).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /regions:
    post:
      tags: [Regions]
      operationId: defineRegion
      summary: Define a region (DefineRegion)
      description: Publishes RegionDefined.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefineRegionRequest'
      responses:
        '201':
          description: Region defined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
        '409':
          description: "region-code-taken (ErrRegionCodeTaken)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: validation-failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [Regions]
      operationId: listRegions
      summary: List regions (ListRegions)
      description: Ordered by regionId. Not paginated (single digits of regions).
      responses:
        '200':
          description: The regions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'
  /regions/{regionId}:
    get:
      tags: [Regions]
      operationId: getRegion
      summary: Get a region (GetRegion)
      parameters:
        - name: regionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The region.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
        '404':
          description: "not-found (ErrNotFound)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-chosen key. A repeat on the same route with the same key and
        request replays the first response. Keys are kept for 24 hours.
        vendor-connectivity sends its transactionId.
      schema:
        type: string
        maxLength: 200
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
    PostalPrefix:
      name: postalPrefix
      in: path
      required: true
      schema:
        type: string
  responses:
    NodeNotFound:
      description: "not-found (ErrNotFound): an unknown nodeId in the path or body."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: >-
            Problem type slug: the shared not-found, illegal-transition,
            concurrent-update and validation-failed, or one of this context's,
            e.g. stale-profile-revision.
          example: stale-profile-revision
        title:
          type: string
        status:
          type: integer
          example: 409
        detail:
          type: string
        instance:
          type: string
    NodeType:
      type: string
      enum: [FULFILLMENT_CENTER, INBOUND_CROSS_DOCK, RETURNS_CENTER, SORTATION_CENTER, DELIVERY_STATION, AIR_HUB]
    NodeSubtype:
      type: string
      description: Only for FULFILLMENT_CENTER.
      enum: [SORTABLE, NON_SORTABLE, XL, SOFT_LINES, SUB_SAME_DAY, FRESH, MICRO]
    NodeOperator:
      type: string
      enum: [NETWORK, VENDOR]
    NodeStatus:
      type: string
      enum: [PROPOSED, ACTIVE, SUSPENDED, RETIRED]
    VendorRef:
      type: object
      required: [vendorId, vendorNodeCode]
      properties:
        vendorId:
          type: string
        vendorNodeCode:
          type: string
          description: The vendor's own code for the node, unique per vendor.
    GeoLocation:
      type: object
      required: [postalCode, countryCode]
      properties:
        postalCode:
          type: string
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2.
          example: BR
        lat:
          type: number
        lon:
          type: number
    NodeCapabilities:
      type: object
      description: Derived from the node type (DefaultCapabilitiesByType), never set by a caller.
      properties:
        outbound:
          type: boolean
        inbound:
          type: boolean
        returns:
          type: boolean
        sort:
          type: boolean
        lastMile:
          type: boolean
        air:
          type: boolean
    RegisterNodeRequest:
      type: object
      required: [nodeType, operator, regionId, timezone, location]
      properties:
        nodeType:
          $ref: '#/components/schemas/NodeType'
        subtype:
          $ref: '#/components/schemas/NodeSubtype'
        operator:
          $ref: '#/components/schemas/NodeOperator'
        vendorRef:
          $ref: '#/components/schemas/VendorRef'
        regionId:
          type: string
        timezone:
          type: string
          description: IANA time zone.
          example: America/Sao_Paulo
        location:
          $ref: '#/components/schemas/GeoLocation'
    DayHours:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          description: Local opening time, HH:mm.
          example: '06:00'
        end:
          type: string
          description: Local closing time, HH:mm.
          example: '22:00'
    Weekday:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    OperatingHoursByDay:
      type: object
      description: Per day of week, the local opening hours. A missing day is closed.
      properties:
        monday:
          $ref: '#/components/schemas/DayHours'
        tuesday:
          $ref: '#/components/schemas/DayHours'
        wednesday:
          $ref: '#/components/schemas/DayHours'
        thursday:
          $ref: '#/components/schemas/DayHours'
        friday:
          $ref: '#/components/schemas/DayHours'
        saturday:
          $ref: '#/components/schemas/DayHours'
        sunday:
          $ref: '#/components/schemas/DayHours'
    CutoffSlot:
      type: object
      required: [localTime]
      properties:
        localTime:
          type: string
          description: Local time, HH:mm, inside the operating hours of every day of the cutoff.
          example: '18:00'
        days:
          type: array
          description: The weekdays the cutoff applies to. Default, when absent, is every operating day.
          items:
            $ref: '#/components/schemas/Weekday'
          minItems: 1
          uniqueItems: true
        maxOrders:
          type: integer
          minimum: 1
    ThroughputCap:
      type: object
      required: [value, timeUnit, unit]
      properties:
        value:
          type: integer
          minimum: 1
        timeUnit:
          type: string
          description: The time unit of the cap.
          enum: [HOUR, DAY]
          example: HOUR
        unit:
          type: string
          enum: [ORDER]
    OperationalProfileDeclaration:
      type: object
      required: [profileRevision, timezone, operatingHoursByDay, handlingTimeMinutes, cutoffs, throughputCap, declaredBy]
      properties:
        profileRevision:
          type: integer
          minimum: 1
          description: Must be strictly greater than the node's current revision.
        timezone:
          type: string
          example: America/Sao_Paulo
        operatingHoursByDay:
          $ref: '#/components/schemas/OperatingHoursByDay'
        holidays:
          type: array
          description: ISO dates on which the node is closed all day.
          items:
            type: string
            format: date
        handlingTimeMinutes:
          type: integer
          minimum: 0
        cutoffs:
          type: array
          items:
            $ref: '#/components/schemas/CutoffSlot'
        throughputCap:
          $ref: '#/components/schemas/ThroughputCap'
        sortDwellMinutes:
          type: integer
          minimum: 0
          description: Declared only by SORTATION_CENTER and AIR_HUB nodes.
        declaredBy:
          type: string
          enum: [VENDOR, NETWORK_OPS]
    OperationalProfile:
      allOf:
        - $ref: '#/components/schemas/OperationalProfileDeclaration'
        - type: object
          required: [declaredAt]
          properties:
            declaredAt:
              type: string
              format: date-time
    Node:
      type: object
      required: [nodeId, nodeType, operator, regionId, timezone, location, capabilities, status]
      properties:
        nodeId:
          type: string
        nodeType:
          $ref: '#/components/schemas/NodeType'
        subtype:
          $ref: '#/components/schemas/NodeSubtype'
        operator:
          $ref: '#/components/schemas/NodeOperator'
        vendorRef:
          $ref: '#/components/schemas/VendorRef'
        regionId:
          type: string
        timezone:
          type: string
        location:
          $ref: '#/components/schemas/GeoLocation'
        capabilities:
          $ref: '#/components/schemas/NodeCapabilities'
        status:
          $ref: '#/components/schemas/NodeStatus'
        operationalProfile:
          $ref: '#/components/schemas/OperationalProfile'
        activatedAt:
          type: string
          format: date-time
        suspendedAt:
          type: string
          format: date-time
        suspendReason:
          type: string
        retiredAt:
          type: string
          format: date-time
    SuspendNodeRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    LaneMode:
      type: string
      enum: [GROUND, AIR]
    OpenLaneRequest:
      type: object
      required: [originNodeId, destinationNodeId, mode, nominalTransitMinutes]
      properties:
        originNodeId:
          type: string
        destinationNodeId:
          type: string
        mode:
          $ref: '#/components/schemas/LaneMode'
        nominalTransitMinutes:
          type: integer
          minimum: 1
    Lane:
      type: object
      required: [laneId, originNodeId, destinationNodeId, mode, nominalTransitMinutes, status]
      properties:
        laneId:
          type: string
        originNodeId:
          type: string
        destinationNodeId:
          type: string
        mode:
          $ref: '#/components/schemas/LaneMode'
        nominalTransitMinutes:
          type: integer
        status:
          type: string
          enum: [OPEN, CLOSED]
        closedAt:
          type: string
          format: date-time
    AssignServiceAreaRequest:
      type: object
      required: [deliveryStationNodeId, assignmentVersion]
      properties:
        deliveryStationNodeId:
          type: string
          description: Must be an ACTIVE DELIVERY_STATION.
        assignmentVersion:
          type: integer
          minimum: 1
          description: Must be strictly greater than the prefix's current version.
    ServiceArea:
      type: object
      required: [postalPrefix, deliveryStationNodeId, regionId, assignmentVersion]
      properties:
        postalPrefix:
          type: string
        deliveryStationNodeId:
          type: string
        regionId:
          type: string
        assignmentVersion:
          type: integer
    DefineRegionRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    Region:
      type: object
      required: [regionId, code, name]
      properties:
        regionId:
          type: string
        code:
          type: string
        name:
          type: string
